name: Build Flous.com Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Compilation APK Release
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code source
        uses: actions/checkout@v4

      - name: Installation de Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Installation de Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Initialisation des fichiers natifs Android manquants
        run: |
          flutter create --project-name flous_app .
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "2.0.21"/g' android/settings.gradle
          sed -i "s/ext.kotlin_version = '[^']*'/ext.kotlin_version = '2.0.21'/g" android/build.gradle || true

      - name: Téléchargement des dépendances
        run: flutter pub get

      - name: Génération de l'APK Release
        run: flutter build apk --release

      - name: Mise à disposition de l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: flous-com-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
